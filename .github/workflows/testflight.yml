name: Build and Upload to TestFlight

on:
  push:
    branches:
      - main
      - fix/gateway-handshake-and-stuck-cases
  pull_request:

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Select Xcode
      #   run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Install Fastlane
        run: gem install fastlane

      - name: Create App Store Connect API Key file
        run: |
          mkdir -p ~/.appstoreconnect
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/auth_key.p8

      - name: Set up codesigning with Match
        run: |
          # Clone the certificates repo
          git clone https://github.com/skylineagle/chowder-certs.git certs
          cd certs
          # Decrypt if needed (match will handle this)
          cd ..
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Run Match (Fetch certificates)
        run: |
          fastlane match appstore
          fastlane match development
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Build iOS App
        run: |
          xcodebuild -workspace Chowder/Chowder.xcworkspace \
            -scheme Chowder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            build

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/Release-iphoneos/Chowder.ipa \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
