name: Build and Upload to TestFlight

on:
  push:
    branches:
      - main
      - fix/gateway-handshake-and-stuck-cases

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Install Fastlane
        run: gem install fastlane

      - name: Create App Store Connect API Key file
        run: |
          mkdir -p ~/.appstoreconnect
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/auth_key.p8

      - name: Run Match (Fetch certificates from private repo)
        run: |
          # Clone the certificates repo
          git clone https://x-access-token:$GITHUB_TOKEN@github.com/skylineagle/chowder-certs.git certs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build iOS App with code signing
        run: |
          xcodebuild -workspace Chowder/Chowder.xcworkspace \
            -scheme Chowder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/Release-iphoneos/Chowder.ipa \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
