name: Build and Upload to TestFlight

on:
  push:
    branches:
      - main
      - fix/gateway-handshake-and-stuck-cases

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Install Fastlane
        run: gem install fastlane

      - name: Create App Store Connect API Key file
        run: |
          mkdir -p ~/.appstoreconnect
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/auth_key.p8

      - name: Run Match (Fetch and sync certificates)
        run: |
          # Clone the certificates repo
          git clone https://x-access-token:$CI_GITHUB_TOKEN@github.com/skylineagle/chowder-certs.git certs
          
          # Run match to sync the certificates
          fastlane match appstore --readonly true
        env:
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Build iOS App
        run: |
          xcodebuild -project Chowder/Chowder.xcodeproj \
            -scheme Chowder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/Release-iphoneos/Chowder.ipa \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
